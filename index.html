```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoBlock ORGIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 35%),
        #0f1115;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(680px, 100%);
      background: #171a21;
      border: 1px solid #2a2f38;
      border-radius: 18px;
      padding: 42px 34px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 20px;
    }

    .badge {
      display: inline-block;
      background: #232833;
      color: #bfc7d5;
      border: 1px solid #333a47;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    h1 span {
      color: #ff3b3b;
    }

    p {
      max-width: 560px;
      margin: 0 auto;
      color: #b8bec9;
      font-size: 18px;
      line-height: 1.65;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .button {
      text-decoration: none;
      color: white;
      background: #ff3b3b;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #ff5151;
    }

    .button.secondary {
      background: #252a34;
      border: 1px solid #343b47;
    }

    .button.secondary:hover {
      background: #303641;
    }

    .footer {
      margin-top: 28px;
      color: #666f7d;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">

    <img
      class="logo"
      src="https://ayysail.github.io/arrotakenn/robloxublockicon.png"
      alt="RoBlock ORGIN Logo"
    />

    <div class="badge">Roblox Browser Extension</div>

    <h1>RoBlock <span>ORGIN</span></h1>

    <p>
      A Roblox extension made to block Roblox+ banners, sponsored ads,
      trackers, and more! We have many other things planned as well.
    </p>

    <div class="buttons">
      <a
        class="button"
        href="https://github.com/Ayysail/Robloxorgin"
        target="_blank"
        rel="noopener noreferrer"
      >
        Github
      </a>

      <a
        class="button secondary"
        href="https://www.roblox.com/"
      >
        Back To Roblox
      </a>
    </div>

    <div class="footer">
      RoBlock ORGIN
    </div>

  </main>
</body>
</html>
